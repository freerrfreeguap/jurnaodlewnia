name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm install
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Supabase anon/publishable key - safe to ship client-side (it's already
          # baked into every production build, protected by Supabase RLS policies).
          # Set these three as repository secrets: Settings > Secrets and
          # variables > Actions > New repository secret.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - run: cp dist/index.html dist/404.html
      - run: sed -i 's|"/icon|"/${{ github.event.repository.name }}/icon|g; s|"/apple-touch-icon|"/${{ github.event.repository.name }}/apple-touch-icon|g' dist/site.webmanifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
